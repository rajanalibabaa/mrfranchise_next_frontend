name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node on runner
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY_DEPLOY }}  # <--- new secret
          port: 22
          script: |
            set -e
            cd /root/mrfranchise_next_frontend
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            cd mrfranchise
            npm run build
            pm2 restart franchise_frontend || pm2 start npm --name "franchise_frontend" -- start
