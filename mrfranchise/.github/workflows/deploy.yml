name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main  # deploy on main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Copy files to server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}        # Your server IP or domain
          username: ${{ secrets.SSH_USER }}    # Your SSH user
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # GitHub secret
          port: 22
          source: ".next,public,package.json,package-lock.json"
          target: "/home/u131609231/domains/mrfranchise.in/public_html"
          rm: true
          # optional: run build commands on server
          script: |
            npm install --production
            npm run build